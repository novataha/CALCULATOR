
name: Build CoDCalculator APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint gettext \
            libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Enable SDK license acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          if not path.exists():
              raise SystemExit("ERROR: buildozer.spec not found!")

          content = path.read_text()
          pattern = r"(?m)^#?\s*android\.accept_sdk_license\s*=.*$"

          if re.search(pattern, content):
              content = re.sub(
                  pattern,
                  "android.accept_sdk_license = True",
                  content
              )
          else:
              content = re.sub(
                  r"(?m)^\[app\]\s*$",
                  "[app]\nandroid.accept_sdk_license = True",
                  content,
                  count=1
              )

          if "android.accept_sdk_license = True" not in content:
              raise SystemExit("Could not enable SDK licenses!")

          path.write_text(content)
          print("Android SDK licenses: automatic acceptance enabled")
          PY

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoDCalculator-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
